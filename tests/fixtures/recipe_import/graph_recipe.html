<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Recipe wrapped in @graph</title>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {"@type": "WebPage", "name": "Some page"},
    {
      "@type": "Recipe",
      "name": "Graph Recipe",
      "recipeIngredient": ["1 cup flour", "2 eggs"],
      "recipeInstructions": "Mix and bake."
    }
  ]
}
</script>
</head>
<body>
<h1>Graph Recipe</h1>
</body>
</html>
